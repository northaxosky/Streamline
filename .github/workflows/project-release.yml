name: Project Streamline release

# Every main push publishes the newest runtime package; consumers take the latest release.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: project-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  OUTPUT: _artifacts\project-release\output
  STAGING: _artifacts\project-release\staging

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
          submodules: recursive
      - name: Require hydrated build libraries
        shell: pwsh
        run: |
          $required = @(
            "external\ngx-sdk\lib\Windows_x86_64\nvsdk_ngx_d.lib"
            "external\ngx-sdk\lib\Windows_x86_64\nvsdk_ngx_d_dbg.lib"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required Git LFS build library is missing: $path"
            }
            $file = Get-Item -LiteralPath $path
            if ($file.Length -lt 1024) {
              throw "Git LFS did not hydrate required build library: $path"
            }
            $prefix = [byte[]]::new(100)
            $stream = [IO.File]::OpenRead($file.FullName)
            try {
              $read = $stream.Read($prefix, 0, $prefix.Length)
            }
            finally {
              $stream.Dispose()
            }
            if ([Text.Encoding]::ASCII.GetString(
                $prefix, 0, $read).StartsWith(
                  "version https://git-lfs.github.com/spec/v1")) {
              throw "Git LFS did not hydrate required build library: $path"
            }
          }

      - name: Configure MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vs) { throw "Visual Studio C++ tools are unavailable." }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          & $env:ComSpec /d /s /c "call `"$vcvars`" >nul && set" |
            Where-Object { $_ -match '^[^=]+=' } |
            Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Configure SDK projects
        shell: pwsh
        run: ./setup.bat vs2022

      - name: Build Production components
        shell: pwsh
        run: |
          msbuild _project/vs2022/streamline.sln /t:Rebuild /m /nologo `
            /verbosity:minimal /p:Configuration=Production /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run regressions
        shell: pwsh
        run: ./tests/run-regressions.ps1

      - name: Assemble package
        shell: pwsh
        run: |
          ./tools/project-release.ps1 `
            -BuildRoot _artifacts `
            -CacheDirectory _artifacts/project-release/cache `
            -OutputDirectory $env:STAGING
          New-Item -ItemType Directory -Force $env:OUTPUT | Out-Null
          $sdk = Join-Path $env:OUTPUT "streamline-sdk.zip"
          $symbols = Join-Path $env:OUTPUT "streamline-symbols.zip"
          Compress-Archive -Path "$env:STAGING\package\*" -DestinationPath $sdk
          Compress-Archive -Path "$env:STAGING\symbols\*" -DestinationPath $symbols
          $hashes = foreach ($file in $sdk, $symbols) {
            "$((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant())  $(Split-Path -Leaf $file)"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $env:OUTPUT "SHA256SUMS.txt"), $hashes,
            [Text.UTF8Encoding]::new($false))

      - name: Publish latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $config = Import-PowerShellDataFile config/project-release.psd1
          $commit = git rev-parse HEAD
          $tag = "cs-streamline-$($config.Upstream.Version)-$(git rev-parse --short=7 HEAD)"
          $assets = Get-ChildItem $env:OUTPUT -File | Select-Object -ExpandProperty FullName
          gh release create $tag @assets `
            --target $commit `
            --title $tag `
            --notes "Streamline runtime built from $commit." `
            --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }